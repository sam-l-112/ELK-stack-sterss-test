---
- name: 系統優化設定 (Kubernetes / Elasticsearch)
  hosts: all
  become: true
  vars:
    memlock_limits:
      - "* soft   memlock   unlimited"
      - "* hard   memlock   unlimited"
    vm_swappiness: 1
    vm_max_map_count: 262144

  tasks:

    - name: 設定 memlock 限制
      lineinfile:
        path: /etc/security/limits.conf
        line: "{{ item }}"
        state: present
        create: yes
      loop: "{{ memlock_limits }}"

    - name: 顯示 limits.conf 最後 5 行
      shell: tail -n 5 /etc/security/limits.conf
      register: limits_tail
      changed_when: false

    - name: 輸出 limits.conf 尾端內容
      debug:
        var: limits_tail.stdout_lines

    - name: 立即關閉 swap
      command: swapoff -a

    - name: 註解 /etc/fstab 中的 swap 設定
      replace:
        path: /etc/fstab
        regexp: '^(.+\sswap\s.+)'
        replace: '# \1'
        backup: yes

    - name: 設定 vm.swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ vm_swappiness }}"
        state: present
        reload: yes

    - name: 設定 vm.max_map_count
      sysctl:
        name: vm.max_map_count
        value: "{{ vm_max_map_count }}"
        state: present
        reload: yes

    - name: 檢查 fstab 中是否有啟用 swap
      shell: grep -E '^[^#].*\sswap\s' /etc/fstab || true
      register: fstab_swap
      changed_when: false

    - name: 顯示 fstab 中啟用的 swap
      debug:
        var: fstab_swap.stdout_lines

    - name: 檢查當前 swap 使用量
      shell: free -h | awk '/^Swap:/ {print $0}'
      register: swap_usage
      changed_when: false

    - name: 顯示當前 swap 使用量
      debug:
        var: swap_usage.stdout_lines

    - name: 顯示 vm.swappiness 設定值
      command: sysctl vm.swappiness
      register: swappiness
      changed_when: false

    - name: 輸出 vm.swappiness 設定
      debug:
        var: swappiness.stdout_lines

    - name: 顯示 vm.max_map_count 設定值
      command: sysctl vm.max_map_count
      register: max_map_count
      changed_when: false

    - name: 輸出 vm.max_map_count 設定
      debug:
        var: max_map_count.stdout_lines